<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Admin - Keluarga Iman Sukiyadi</title><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(145deg, #e8f5e9, #f7fbf7);
  color: #145c3b;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow: hidden;
  position: relative;
}

/* Hiasan daun */
body::before,
body::after {
  content: "🌿";
  position: fixed;
  font-size: 110px;
  opacity: 0.15;
  pointer-events: none;
}

body::before {
  top: 5px;
  left: -15px;
  transform: rotate(-35deg);
}

body::after {
  bottom: 5px;
  right: -15px;
  transform: rotate(35deg);
}

.login-box {
  width: 100%;
  max-width: 390px;
  background: white;
  border-radius: 20px;
  padding: 28px 24px;
  text-align: center;
  box-shadow: 0 8px 30px #145c3b20;
  position: relative;
  z-index: 1;
}

.logo {
  font-size: 75px;
  line-height: 1.2;
  margin-bottom: 8px;
}

h1 {
  font-size: 23px;
  line-height: 1.3;
  margin: 5px 0;
  color: #145c3b;
}

.subjudul {
  font-size: 13px;
  color: #718078;
  margin-bottom: 24px;
}

.form-title {
  background: #145c3b;
  color: white;
  padding: 13px;
  margin: 0 -24px 20px;
  font-size: 18px;
  font-weight: bold;
}

.input-group {
  position: relative;
  margin-bottom: 14px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccd8cf;
  border-radius: 9px;
  font-size: 15px;
  outline: none;
  background: #fff;
}

input:focus {
  border-color: #218653;
  box-shadow: 0 0 0 3px #21865320;
}

.password-wrap {
  position: relative;
}

.password-wrap input {
  padding-right: 48px;
}

.lihat-password {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  font-size: 19px;
  cursor: pointer;
  padding: 5px;
}

button.masuk {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 9px;
  background: linear-gradient(135deg, #16803e, #07542d);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 5px;
}

button.masuk:disabled {
  opacity: 0.6;
  cursor: wait;
}

button.masuk:active {
  transform: scale(0.98);
}

.info {
  margin-top: 20px;
  font-size: 13px;
  color: #65766b;
}

#status {
  font-size: 12px;
  color: #218653;
  margin-top: 15px;
  overflow-wrap: anywhere;
}

footer {
  margin-top: 22px;
  font-size: 11px;
  color: #8a9a8f;
}

</style></head><body><div class="login-box">  <div class="logo">🌳</div>  <h1>Keluarga Besar<br>Iman Sukiyadi</h1>  <div class="subjudul">
    Bersatu, Rukun, dan Bahagia
  </div>  <div class="form-title">
    LOGIN ADMIN
  </div>  <form id="loginForm"><div class="input-group">
  <input
    id="username"
    type="text"
    placeholder="Nama Pengguna"
    autocomplete="username"
    required
  >
</div>

<div class="input-group password-wrap">
  <input
    id="password"
    type="password"
    placeholder="Kata Sandi"
    autocomplete="current-password"
    required
  >

  <button
    type="button"
    class="lihat-password"
    id="lihatPassword"
    aria-label="Lihat kata sandi"
  >👁️</button>
</div>

<button type="submit" class="masuk" id="masukBtn">
  ➜ MASUK
</button>

  </form>  <div class="info">
    🔒 Halaman khusus administrator
  </div>  <p id="status">Menghubungkan Firebase...</p>  <footer>
    © Keluarga Besar Iman Sukiyadi
  </footer></div><script type="module">

try {

  const { auth } = await import("./js/firebase.js");

  const { signInWithEmailAndPassword } =
    await import("https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js");

  document.getElementById("status").textContent =
    "Firebase berhasil dimuat.";

  document.getElementById("loginForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const username =
      document.getElementById("username").value.trim();

    const password =
      document.getElementById("password").value;

    const tombol = document.getElementById("masukBtn");

    if (username !== "admin") {
      alert("Nama pengguna salah!");
      return;
    }

    tombol.disabled = true;
    tombol.textContent = "Memeriksa akun...";

    try {

      await signInWithEmailAndPassword(
        auth,
        "hasman0709@gmail.com",
        password
      );

      alert("Login berhasil!");

      window.location.href = "admin.html";

    } catch (error) {

      alert("Login gagal: " + error.code);

      tombol.disabled = false;
      tombol.textContent = "➜ MASUK";

    }

  });

} catch (error) {

  document.getElementById("status").textContent =
    "Firebase gagal dimuat: " + error.message;

}

// TOMBOL LIHAT KATA SANDI
document.getElementById("lihatPassword").onclick = function() {

  const password = document.getElementById("password");

  if (password.type === "password") {
    password.type = "text";
    this.textContent = "🙈";
  } else {
    password.type = "password";
    this.textContent = "👁️";
  }

};

</script></body>
</html>
