<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tes Login</title>
</head>
<body><h2>TES TOMBOL LOGIN</h2><form id="loginForm">
  <input id="username" placeholder="Nama pengguna" required>
  <br><br>
  <input id="password" type="password" placeholder="Kata sandi" required>
  <br><br>
  <button type="submit">LOGIN</button>
</form><script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();
  alert("TOMBOL LOGIN BERFUNGSI!");
});
</script></body>
</html>
