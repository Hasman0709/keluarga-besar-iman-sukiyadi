<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Admin - Keluarga Besar Iman Sukiyadi</title><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(145deg, #e5f5e9, #f7fbf7);
  color: #145c3b;
}

.login-box {
  width: 100%;
  max-width: 390px;
  background: white;
  border-radius: 20px;
  padding: 28px 23px;
  text-align: center;
  box-shadow: 0 6px 25px #145c3b20;
  overflow: hidden;
}

.logo {
  width: 105px;
  height: 105px;
  margin: 0 auto 15px;
  border-radius: 50%;
  background: #e9f7ec;
  border: 3px solid #b8dfa9;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 65px;
}

h1 {
  font-family: Georgia, serif;
  font-size: 23px;
  line-height: 1.3;
  margin: 5px 0;
}

.slogan {
  color: #6d8173;
  font-size: 13px;
  font-style: italic;
  margin-bottom: 25px;
}

.judul-form {
  background: #145c3b;
  color: white;
  padding: 14px;
  margin: 0 -23px 22px;
  font-size: 18px;
  font-weight: bold;
}

label {
  display: block;
  text-align: left;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 7px;
}

.input-group {
  margin-bottom: 17px;
  text-align: left;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccd8cf;
  border-radius: 9px;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #16803e;
  box-shadow: 0 0 0 3px #16803e20;
}

.password-box {
  position: relative;
}

.password-box input {
  padding-right: 50px;
}

.lihat {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  font-size: 19px;
  cursor: pointer;
}

.masuk {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 9px;
  background: linear-gradient(135deg, #16803e, #07542d);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.masuk:disabled {
  opacity: 0.6;
}

.keterangan {
  margin-top: 20px;
  font-size: 13px;
  color: #687b6e;
}

#status {
  font-size: 12px;
  color: #218653;
  margin-top: 13px;
  overflow-wrap: anywhere;
}

.kembali {
  display: inline-block;
  margin-top: 20px;
  color: #145c3b;
  text-decoration: none;
  font-size: 14px;
}

footer {
  margin-top: 20px;
  font-size: 11px;
  color: #91a095;
}
</style></head><body><div class="login-box">  <div class="logo">🌳</div>  <h1>
    Keluarga Besar<br>
    Iman Sukiyadi
  </h1>  <div class="slogan">
    Mengenal keluarga, menjaga silaturahmi
  </div>  <div class="judul-form">
    🔐 LOGIN ADMIN
  </div>  <form id="loginForm"><div class="input-group">
  <label>Nama Pengguna</label>
  <input
    id="username"
    type="text"
    placeholder="Masukkan nama pengguna"
    autocomplete="username"
    required
  >
</div>

<div class="input-group">
  <label>Kata Sandi</label>

  <div class="password-box">
    <input
      id="password"
      type="password"
      placeholder="Masukkan kata sandi"
      autocomplete="current-password"
      required
    >

    <button
      type="button"
      class="lihat"
      id="lihatPassword"
    >👁️</button>
  </div>
</div>

<button type="submit" class="masuk" id="masukBtn">
  ➜ MASUK
</button>

  </form>  <div class="keterangan">
    🔒 Halaman khusus administrator
  </div>  <p id="status">Menghubungkan Firebase...</p>  <a href="index.html" class="kembali">
    ← Kembali ke Beranda
  </a>  <footer>
    © Keluarga Besar Iman Sukiyadi
  </footer></div><script type="module">

try {

  const { auth } = await import("./js/firebase.js");

  const { signInWithEmailAndPassword } =
    await import("https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js");

  document.getElementById("status").textContent =
    "Firebase berhasil dimuat.";

  document.getElementById("loginForm")
    .addEventListener("submit", async function(e) {

      e.preventDefault();

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      const tombol = document.getElementById("masukBtn");

      if (username !== "admin") {
        alert("Nama pengguna salah!");
        return;
      }

      tombol.disabled = true;
      tombol.textContent = "Memeriksa akun...";

      try {

        await signInWithEmailAndPassword(
          auth,
          "hasman0709@gmail.com",
          password
        );

        alert("Login berhasil!");

        window.location.href = "admin.html";

      } catch (error) {

        alert("Login gagal: " + error.code);

        tombol.disabled = false;
        tombol.textContent = "➜ MASUK";

      }

    });

} catch (error) {

  document.getElementById("status").textContent =
    "Firebase gagal dimuat: " + error.message;

}

document.getElementById("lihatPassword").onclick = function() {

  const password = document.getElementById("password");

  if (password.type === "password") {
    password.type = "text";
    this.textContent = "🙈";
  } else {
    password.type = "password";
    this.textContent = "👁️";
  }

};

</script></body>
</html>
