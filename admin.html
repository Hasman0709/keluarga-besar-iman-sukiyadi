<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Keluarga Iman Sukiyadi</title><style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f0f5f1;
  margin: 0;
  color: #263b30;
}

header {
  background: linear-gradient(135deg, #145c3b, #218653);
  color: white;
  padding: 25px 15px;
  text-align: center;
}

header h2 {
  margin: 0 0 8px;
  font-size: 23px;
}

header p {
  margin: 0 0 15px;
  font-size: 14px;
}

nav {
  margin-bottom: 12px;
}

nav a {
  color: white;
  margin: 5px 8px;
  display: inline-block;
  text-decoration: none;
  font-size: 14px;
}

nav a:hover {
  text-decoration: underline;
}

.container {
  padding: 16px;
  max-width: 750px;
  margin: auto;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px #00000012;
}

.card h3 {
  color: #145c3b;
  margin-top: 0;
  padding-bottom: 12px;
  border-bottom: 1px solid #e5eee7;
}

label {
  display: block;
  font-weight: bold;
  font-size: 14px;
  margin-top: 10px;
}

input, select {
  width: 100%;
  padding: 13px;
  margin: 7px 0 12px;
  border: 1px solid #ccd8cf;
  border-radius: 8px;
  background: white;
  font-size: 15px;
  color: #263b30;
}

input:focus, select:focus {
  outline: none;
  border-color: #218653;
  box-shadow: 0 0 0 2px #21865320;
}

button {
  padding: 12px 17px;
  border: none;
  border-radius: 8px;
  background: #145c3b;
  color: white;
  font-size: 14px;
  cursor: pointer;
  margin: 4px 2px;
}

button:active {
  transform: scale(0.97);
}

button:hover {
  opacity: 0.9;
}

#simpanBtn {
  width: 100%;
  margin-top: 12px;
  font-weight: bold;
}

#batalBtn {
  background: #68766d;
  width: 100%;
}

.hapus, .logout {
  background: #c62828;
}

.edit {
  background: #e18a00;
}

.anggota {
  border-bottom: 1px solid #e1e8e3;
  padding: 15px 0;
  line-height: 1.5;
}

.anggota:last-child {
  border-bottom: none;
}

.anggota strong {
  display: block;
  color: #145c3b;
  font-size: 16px;
  margin-bottom: 5px;
}

#jumlahAnggota {
  background: #e9f5ec;
  color: #145c3b;
  padding: 10px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 20px;
  color: #718078;
  font-size: 12px;
}

@media (max-width: 480px) {
  header h2 {
    font-size: 20px;
  }

  .container {
    padding: 12px;
  }

  .card {
    padding: 16px;
  }

  button {
    padding: 12px;
  }
}
</style></head><body><header>
  <h2>🌳 ADMIN KELUARGA</h2>
  <p>Keluarga Besar Iman Sukiyadi</p>  <nav>
    <a href="index.html">🏠 Beranda</a>
    <a href="silsilah.html">🌳 Pohon Silsilah</a>
  </nav><button class="logout" id="logoutBtn">Keluar</button>

</header><div class="container">  <div class="card">
    <h3 id="judulForm">Tambah Anggota Keluarga</h3><form id="anggotaForm">

  <label>Nama lengkap</label>
  <input
    id="nama"
    type="text"
    required
    placeholder="Masukkan nama lengkap"
  >

  <label>Jenis kelamin</label>
  <select id="jenisKelamin" required>
    <option value="">Pilih jenis kelamin</option>
    <option value="Laki-laki">Laki-laki</option>
    <option value="Perempuan">Perempuan</option>
  </select>

  <label>Tanggal lahir</label>
  <input type="date" id="tanggalLahir">

  <label>Nama ayah</label>
  <select id="ayahId">
    <option value="">Belum diketahui / tidak ada</option>
  </select>

  <label>Nama ibu</label>
  <select id="ibuId">
    <option value="">Belum diketahui / tidak ada</option>
  </select>

  <button type="submit" id="simpanBtn">
    💾 Simpan Anggota
  </button>

  <button type="button" id="batalBtn" hidden>
    Batal Edit
  </button>

</form>

  </div>  <div class="card">
    <h3>👨‍👩‍👧‍👦 Daftar Anggota Keluarga</h3><p id="jumlahAnggota">Memuat data...</p>

<div id="daftarAnggota"></div>

  </div></div><footer>
  Keluarga Besar Iman Sukiyadi
</footer><script type="module" src="js/admin.js"></script></body>
</html>
